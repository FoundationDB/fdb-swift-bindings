name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # The setup-swift action supports Ubuntu 22.04 and 24.04 only; `ubuntu-latest` is moving to 26.04.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        fdb-version:
          - "7.3.43"
        swift-version:
          - "6.4.2"

    name: FDB/Swift Bindings - ${{ matrix.fdb-version }} (Swift ${{ matrix.swift-version }})

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup FoundationDB
      uses: ./.github/actions/setup-fdb
      with:
        fdb_version: ${{ matrix.fdb-version }}

    - name: Setup Swift
      uses: ./.github/actions/setup-swift
      with:
        swift_version: ${{ matrix.swift-version }}

    - name: Build Bindings
      run: swift build

    - name: Run Unit Tests
      run: swift test
