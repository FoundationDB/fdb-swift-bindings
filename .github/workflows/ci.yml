name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # Pinned to 24.04 for now because of https://github.com/swift-actions/setup-swift/issues/805
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        fdb-version:
          - "7.3.43"
        swift-version:
          - "6.2"

    name: FDB/Swift Bindings - ${{ matrix.fdb-version }} (Swift ${{ matrix.swift-version }})

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup FoundationDB
      uses: ./.github/actions/setup-fdb
      with:
        fdb_version: ${{ matrix.fdb-version }}

    - name: Setup Swift
      uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
      with:
        swift-version: "${{ matrix.swift-version }}"

    - name: Build Bindings
      run: swift build

    - name: Run Unit Tests
      run: swift test
